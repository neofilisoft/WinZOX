[package]
name = "winzox-archive-read"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Rust 1.95 reimplementation of the WZOX/ZOX read-side core: magic detection, SHA-512+SHA3-256 integrity accumulator, central-directory parser, and archive metadata reader. Linked into WinZOX 3.1.0 via C ABI."

[lib]
name = "winzox_archive_read"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
sha2 = "0.10"
sha3 = "0.10"
subtle = "2"
thiserror = "1"
crc32fast = "1"

[dev-dependencies]
hex-literal = "0.4"
